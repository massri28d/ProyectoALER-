// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.1.3'
    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
    classpath 'com.google.gms:google-services:4.4.2' // solo si usas Firebase
  }
}

apply from: "variables.gradle"

allprojects {
  repositories {
    google()
    mavenCentral()
  }
}

// Fuerza Java 17 en subproyectos Android y (si hay) Kotlin, sin usar --release
subprojects {
  afterEvaluate {
    if (plugins.hasPlugin('com.android.application') || plugins.hasPlugin('com.android.library')) {
      android {
        compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
        }
      }
    }
  }
  tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = '17'
    targetCompatibility = '17'
    // NO poner: options.release = 17
  }
  // Si algún módulo usa Kotlin, fija jvmTarget 17
  tasks.matching { it.name.toLowerCase().contains('kotlin') }.configureEach {
    if (it.hasProperty('kotlinOptions')) {
      it.kotlinOptions.jvmTarget = '17'
    }
  }
}

task clean(type: Delete) {
  delete rootProject.buildDir
}
