<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Usuarios registrados</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button expand="block" color="secondary" (click)="descargarDb()">Descargar base de datos</ion-button>
  <div *ngIf="loading">Cargando usuarios...</div>
  <ion-list *ngIf="!loading">
    <ion-item *ngFor="let usuario of usuarios">
      <ion-label>
        <h2>{{ usuario.nombre }}</h2>
        <p>Email: {{ usuario.email }}</p>
        <p>Teléfono: {{ usuario.telefono }}</p>
        <p>Género: {{ usuario.genero }}</p>
        <p>Fecha de nacimiento: {{ usuario.fechaNacimiento }}</p>
      </ion-label>
    </ion-item>
    <ion-item *ngIf="usuarios.length === 0">
      <ion-label>No hay usuarios registrados.</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
