<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding registro-bg">
  <div class="registro-container">
    <h1 class="registro-title">Registro</h1>
    <form>
      <ion-item class="registro-item">
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input type="email" [(ngModel)]="email" name="email" required></ion-input>
      </ion-item>
      <ion-item class="registro-item">
        <ion-label position="floating">RUT</ion-label>
        <ion-input type="text" [(ngModel)]="rut" name="rut" required maxlength="20" pattern="[0-9kK\-]+"></ion-input>
      </ion-item>
      <ion-item class="registro-item">
        <ion-label position="floating">Nombre</ion-label>
        <ion-input type="text" [(ngModel)]="nombre" name="nombre" required></ion-input>
      </ion-item>
      <ion-item class="registro-item">
        <ion-label position="floating">Fecha de nacimiento</ion-label>
        <ion-input type="text" [(ngModel)]="fechaNacimiento" name="fechaNacimiento" required placeholder="Ejemplo: 1992/04/26"></ion-input>
      </ion-item>
      <ion-item class="registro-item">
        <ion-label position="floating">Teléfono</ion-label>
        <ion-input type="tel" [(ngModel)]="telefono" name="telefono" required></ion-input>
      </ion-item>
      <ion-item class="registro-item">
        <ion-label position="floating">Género</ion-label>
        <ion-select [(ngModel)]="genero" name="genero" required>
          <ion-select-option value="masculino">Masculino</ion-select-option>
          <ion-select-option value="femenino">Femenino</ion-select-option>
          <ion-select-option value="otro">Otro</ion-select-option>
        </ion-select>
      </ion-item>
      <ion-item class="registro-item">
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input type="password" [(ngModel)]="password" name="password" required></ion-input>
      </ion-item>
  <ion-button expand="block" color="primary" (click)="registrar()">Registrarse</ion-button>
      <ion-button expand="block" fill="clear" color="primary" (click)="volverLogin()">Volver al login</ion-button>
    </form>
  </div>
</ion-content>
