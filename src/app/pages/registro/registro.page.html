<ion-header [translucent]="false">
  <ion-toolbar color="primary">
    <ion-title>Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding registro-bg">
  <div class="registro-container">
    <h1 class="registro-title">Registro</h1>

    <ion-list lines="full">
      <ion-item>
        <ion-label position="floating">Correo electrónico</ion-label>
        <ion-input type="email" autocomplete="email" name="email" [(ngModel)]="email"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">RUT</ion-label>
        <ion-input type="text" name="rut" maxlength="20" [(ngModel)]="rut"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Nombre</ion-label>
        <ion-input type="text" name="nombre" [(ngModel)]="nombre"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Fecha de nacimiento (opcional)</ion-label>
        <ion-input type="date" name="fechaNacimiento" [(ngModel)]="fechaNacimiento"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Teléfono</ion-label>
        <ion-input type="tel" inputmode="numeric" name="telefono" [(ngModel)]="telefono"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Género</ion-label>
        <ion-select name="genero" interface="popover" [(ngModel)]="genero">
          <!-- Usa exactamente estos textos (coinciden con tu CHECK de la DB) -->
          <ion-select-option value="Masculino">Masculino</ion-select-option>
          <ion-select-option value="Femenino">Femenino</ion-select-option>
          <ion-select-option value="Otro">Otro</ion-select-option>
          <ion-select-option value="Prefiero no decir">Prefiero no decir</ion-select-option>
        </ion-select>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input type="password" autocomplete="new-password" name="password" [(ngModel)]="password"></ion-input>
      </ion-item>
    </ion-list>

    <ion-button expand="block" color="primary" (click)="registrar()">REGISTRARSE</ion-button>
    <ion-button expand="block" fill="clear" color="primary" (click)="volverLogin()">VOLVER AL LOGIN</ion-button>
  </div>
</ion-content>
