<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay">
      <ion-content>
        <ion-list id="inbox-list">
          <ion-list-header>ALER</ion-list-header>
          <ion-note>Detecta ingredientes con la palma de la mano</ion-note>

          @for (p of appPages; track p; let i = $index) {
            <ion-menu-toggle auto-hide="false">
              <ion-item
                routerDirection="root"
                [routerLink]="[p.url]"
                lines="none"
                detail="false"
                routerLinkActive="selected"
                [class.admin-item]="p.admin">
                <ion-icon
                  aria-hidden="true"
                  slot="start"
                  [ios]="p.icon + '-outline'"
                  [md]="p.icon + '-sharp'">
                </ion-icon>
                <ion-label>
                  {{ p.title }}
                  <ion-badge *ngIf="p.admin" color="danger" slot="end">Admin</ion-badge>
                </ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        </ion-list>

        <ion-list id="labels-list">
          <ion-list-header>Labels</ion-list-header>

          @for (label of labels; track label) {
            <ion-item lines="none">
              <ion-icon aria-hidden="true" slot="start" ios="bookmark-outline" md="bookmark-sharp"></ion-icon>
              <ion-label>{{ label }}</ion-label>
            </ion-item>
          }
        </ion-list>

        <!-- Usuario actual y botón logout -->
        <ion-list id="user-section" style="margin-top: auto; padding-top: 20px; border-top: 1px solid var(--ion-border-color);">
          <ion-item lines="none" *ngIf="getCurrentUser()">
            <ion-icon aria-hidden="true" slot="start" ios="person-circle-outline" md="person-circle-sharp"></ion-icon>
            <ion-label>
              <h2>{{ getCurrentUser()?.nombre }}</h2>
              <p>{{ getCurrentUser()?.email }}</p>
              <ion-badge *ngIf="isAdmin()" color="success" style="margin-top: 4px;">
                <ion-icon name="shield-outline" slot="start"></ion-icon>
                Administrador
              </ion-badge>
            </ion-label>
          </ion-item>

          <ion-button
            expand="block"
            color="danger"
            (click)="logout()"
            style="margin-top: 10px;">
            <ion-icon aria-hidden="true" slot="start" ios="log-out-outline" md="log-out-sharp"></ion-icon>
            Cerrar sesión
          </ion-button>
        </ion-list>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
